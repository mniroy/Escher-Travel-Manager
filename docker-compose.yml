services:
  escher-travel-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escher_travel_manager
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_PATH=/app/data
      - DATABASE_URL=postgres://${POSTGRES_USER:-escher}:${POSTGRES_PASSWORD:-escherpassword}@postgres:5432/${POSTGRES_DB:-escher_travel}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: escher_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-escher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escherpassword}
      POSTGRES_DB: ${POSTGRES_DB:-escher_travel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-escher} -d ${POSTGRES_DB:-escher_travel}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_data:
